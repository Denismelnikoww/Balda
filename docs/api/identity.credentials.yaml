openapi: 3.0.3
info:
  title: identity.credentials
  version: 1.0.0
  description: Аккаунты владельцев, связки с провайдерами, мандаты (OAuth-токены).
servers:
  - url: https://api.gonyatbaldu.local/identity
tags:
  - name: owners
  - name: connections
  - name: internal
    description: Внутренние эндпоинты для других сервисов
paths:
  /owners:
    post:
      tags: [owners]
      summary: Зарегистрировать владельца
      operationId: registerOwner
      security:
        - oidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
            example:
              email: "ivan@example.com"
              displayName: "Иван"
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /owners/{ownerId}:
    get:
      tags: [owners]
      summary: Получить владельца
      operationId: getOwner
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/OwnerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'
  /owners/{ownerId}/connections:
    get:
      tags: [connections]
      summary: Список связок владельца
      operationId: listConnections
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
    post:
      tags: [connections]
      summary: Начать OAuth-подключение провайдера
      operationId: createConnection
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
            example:
              provider: GIT_PROVIDER
              redirectUri: "https://app.gonyatbaldu.local/oauth/callback"
      responses:
        '201':
          description: Создана, возвращается URL авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /connections/{connectionId}:
    delete:
      tags: [connections]
      summary: Отозвать связку
      operationId: revokeConnection
      security: [{ oidc: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '204':
          description: Отозвана
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/connections/{connectionId}/mandate:
    post:
      tags: [internal]
      summary: Выдать действующий мандат (OHS для Delivery/Plan)
      operationId: resolveMandate
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Мандат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Мандат отозван или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.gonyatbaldu.local/realms/gb/.well-known/openid-configuration
  parameters:
    OwnerId:
      name: ownerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string, example: "Connection not found" }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
        traceId: { type: string, example: "b7e2c1a4-..." }
        timestamp: { type: string, format: date-time }
    RegisterOwnerRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 200 }
    Owner:
      type: object
      required: [id, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
    CreateConnectionRequest:
      type: object
      required: [provider, redirectUri]
      properties:
        provider: { type: string, enum: [GIT_PROVIDER, WK_TEAMS, LEDMINE] }
        redirectUri: { type: string, format: uri }
    Connection:
      type: object
      required: [id, ownerId, provider, status, authorizationUrl]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        provider: { type: string, enum: [GIT_PROVIDER, WK_TEAMS, LEDMINE] }
        status: { type: string, enum: [PENDING, ACTIVE, REVOKED] }
        authorizationUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
    ConnectionPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Connection' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    Mandate:
      type: object
      required: [connectionId, provider, accessToken, scopes, expiresAt]
      properties:
        connectionId: { type: string, format: uuid }
        provider: { type: string }
        accessToken: { type: string, description: "Короткоживущий токен; не логируется" }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time }